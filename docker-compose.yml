services:
  postgres:
    image: postgres:16-alpine
    container_name: custotransportes_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-custotransportes}
      POSTGRES_USER: ${POSTGRES_USER:-custo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    # 5433 no host para não colidir com um Postgres já instalado na 5432.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-custo} -d ${POSTGRES_DB:-custotransportes}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
